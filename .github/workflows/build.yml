name: ci

# Nothing here talks to a mirror, a :latest image or a live site, so it is a gate
# rather than a detector and pull requests run the whole of it
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: the ref to check out, so a bot can verify a branch with this very workflow
        type: string
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: cachix/install-nix-action@v31
      - name: tests/check.sh
        run: nix develop --no-write-lock-file -c ./tests/check.sh
